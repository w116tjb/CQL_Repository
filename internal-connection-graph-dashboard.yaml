      | case { __xSU  = "" ; * | test(UserName            != __xSU ) ; }
      | case { __xDI  = "" ; * | test(RemoteIP            != __xDI ) ; }
      | case { __xDPo = "" ; * | test(format("%s", field=[RemotePort]) != __xDPo) ; }
