      // Source-side INCLUSION filters (wildcards: '*' = all, '*sql*' = substring, 'prod-*' = prefix)
      | ComputerName        =~ wildcard(?{SourceHost="*"},    ignoreCase=true, includeEverythingOnAsterisk=true)
      | ContextBaseFileName =~ wildcard(?{SourceProcess="*"}, ignoreCase=true, includeEverythingOnAsterisk=true)
