          field=[LocalIP, LocalPort, RemoteIP, RemotePort],
          key=[DestRemoteIP, DestRemotePort, DestLocalIP, DestLocalPort],
          include=[DestAid, DestHost, DestProcess],
          mode=inner, start=1h)
      | Edge := format(format="%s/%s -> %s/%s", field=[SourceHost, SourceProcess, DestHost, DestProcess])
      | count(Edge, distinct=true, as=UniqueEdges)
    end: now
    start: 1h
    visualization: single-value
    options:
      default: {}
      use-colorised-thresholds: false
    isLive: false

  # ----------------------------------------------- TIME CHART: connections
  chart-connections-time:
    type: query
    x: 0
    y: 8
    width: 12
    height: 4
    title: Connections Over Time
    queryString: |-
      (#event_simpleName=NetworkConnectIP4 OR #event_simpleName=NetworkConnectIP6)
